[env:xmas25__meadows__side_tree]
extends = env:whitehall_32
build_flags = ${common.build_flags} -w
                    -D DEVICE_XMAS25__MEADOWS__SIDE_TREE
                    ; -D FIRMWARE_DEFAULT__MODULE_TEMPLATE__GENERIC_MINIMUM
                    -D FIRMWARE_DEFAULT__LIGHTING_CONFIG__COMPLETE
                    -D FIRMWARE_DEFAULT__ENABLE_SOLAR_PALETTES
                    -D USE_USER_MICHAEL
                    '-DDEVICENAME_CTR="xmas25__side_tree"'
                    '-DDEVICENAME_FRIENDLY_CTR="Meadows Fence Side Tree#Outside"'
                    '-DSTA_SSID1="AuroraSide"'
                    '-DSTA_PASS1="af4d8bc9ab"'
; lib_extra_dirs = ${common32.lib_extra_dirs}
