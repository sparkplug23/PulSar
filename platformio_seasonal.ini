[env:cm_office__ws2815panel12v]
extends = env:whitehall_32
build_flags = ${common.build_flags} -w
                    -D DEVICE_XMAS25__MEADOWS__WS2815_PANEL_12V
                    -D FIRMWARE_DEFAULT__LIGHTING_CONFIG__COMPLETE
                    -D FIRMWARE_DEFAULT__INCLUDE_WEBSERVER_FULL
                    -D ENABLE_DEBUGFEATURE_LIGHTS__SEGMENT_BRIGHTNESS_LIMIT_VALUE=20
                    ; -D ENABLE_DEBUGFEATURE_LIGHTS__GLOBAL_BRIGHTNESS_LIMIT_VALUE=10
                    -D ENABLE_DEVFEATURE_LIGHTS__PRESET_TESTING_GROUPING_OVERRIDE_RESCALE_TO_STRIP
                    -D ENABLE_DEBUGFEATURE_TIME__SHOW_UPTIME_EVERY_SECOND
                    -D USE_USER_MICHAEL
                    '-DDEVICENAME_CTR="office__ws2815panel12v"'
                    '-DDEVICENAME_FRIENDLY_CTR="WS2815 12V Desk Panel#Desk"'
                    -DCORE_DEBUG_LEVEL=5
                    -DCONFIG_ARDUHAL_LOG_DEFAULT_LEVEL=5
                    -DARDUHAL_LOG_COLORS=0
                    ; Add crash recording
                    -D USE_MODULE_CORE__CRASH_RECORDER
                    -Wl,-Map,firmware.map
                    -Wl,--wrap=panicHandler -Wl,--wrap=xt_unhandled_exception
; lib_extra_dirs = ${common32.lib_extra_dirs}
upload_protocol = espota
; upload_port = 192.168.2.5
upload_port = office--ws2815panel12v
; monitor_filters = esp32_exception_decoder
; build_type = debug
; upload_port = COM98
; upload_port = COM83


