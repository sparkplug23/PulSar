[env:valid__esp32__camera_wroover_e]
board = esp32dev
; board = esp-wrover-kit
platform = espressif32@6.4.0
; framework = arduino
framework = arduino
platform_packages = platformio/framework-arduinoespressif32@3.20011.230801

upload_protocol = esptool
upload_port = COM19          ; change as needed
; upload_speed = 460800
; upload_port = 192.168.2.25

; build_unflags = -mtarget-align
;     -DARDUINO_VARIANT
board_build.flash_mode = dio
board_build.boot = qio
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.mcu = esp32
board_build.psram = enabled

board_build.partitions = partitions/esp32_default.csv   ; or your custom one
board_build.ldscript =
lib_ignore =
    esp32-camera
lib_ldf_mode = chain+
; lib_ldf_mode = off
lib_extra_dirs =
    lib/lib_basic
    lib/lib_network
    lib/lib_display 
    lib/lib_onewire2023 
    lib/lib_sensor                          
    lib/lib_custom
    lib/lib_wled32
    lib/lib_neo_original25
    lib/lib_i2c
    lib/lib_energy
    lib/lib_network_web
    lib/libesp32
    lib/lib_default
    lib/lib_basic
    lib/libesp32/network
    lib/lib_network
    lib/lib_onewire2023 
    lib/lib_sensor
    lib/libesp32
    lib/lib_basic
    lib/lib_network
    lib/lib_display
    lib/lib_onewire2023 
    lib/lib_sensor      
    lib/lib_wled32
    lib/lib_neopixel_june24_ws2805
    lib/lib_i2c
    lib/lib_energy
    lib/lib_nextion_esp32_web
    lib/lib_default
    lib/lib_tasserial2 # using tasserial from 2024 


build_flags =
    ; -include sdkconfig.override
    ; -include sdkconfig_wroover.h
    -w
    ; -include sdkconfig_wroover.h
    -D DEVICE_VALIDATION__ESP32__CAMERA_WROOVER_E
    -D USE_MODULE_DRIVERS__CAMERA
    -D ENABLE_DEVFEATURE_ANALOG_WRITE_EMULATION_VERSION2
    -D USE_USER_MICHAEL
    -D I2C_BUS_SPEED=400000
    -DBOARD_HAS_PSRAM
    '-DDEVICENAME_CTR="validation_cam_wroover"'
    '-DDEVICENAME_FRIENDLY_CTR="validation_cam_wroover#Desk"'    
    -D SETTINGS_LOCATION=0x300000
    -D SETTINGS_SIZE=0x10000
    -D CORE_DEBUG_LEVEL=5
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D Serial=Serial0
    -D ENABLE_DEBUG_LINE_HERE3
    -D ENABLE_DEBUG_MANUAL_DELAYS
    ; -D ENABLE_DEBUG_SPLASH__PSRAM_USAGE
    -D ENABLE_DEBUGFEATURE_LOGS__FORCE_FLUSH_ON_TRANSMIT
    -D DISABLE_LEDC_DEFINE_TO_PATCH_BUILD_ERROR_JUNE25
    -D ENABLE_IMMEDIATE_BOOT_SERIAL_PRINT_WHILE
    ; -D ENABLE_DEBUGFEATURE_TIME__SHOW_UPTIME_EVERY_SECOND
    -D ENABLE_DEBUG_MODULE_HARDWAREPINS_SUBSECTION_TEMPLATES
    -Ilib/lib_esp32_camera2/driver/private_include
    -Ilib/lib_esp32_camera2/driver/include
    -Ilib/lib_esp32_camera2/conversions
    -I"C:/Users/micha/.platformio/packages/framework-arduinoespressif32/tools/esp32-arduino-libs/esp32/include/esp_hw_support/include"


