; ============================================================================
; PulSar Compile Validation Environments
; ============================================================================
;
; NO REAL HARDWARE REQUIRED
;
; Purpose:
;   A firmware version is considered valid only if all environments below
;   compile successfully.
;
; These environments are primarily COMPILE TESTS.
; Upload/runtime settings should not be added unless specifically required
; for hardware validation.
;
; Hardware/platform/library configuration belongs in:
;   zplatformio_config/platformio_base.ini
;
; Validation environments should contain only:
;   - appropriate base inheritance
;   - DEVICE_VALIDATION define
;   - firmware/configuration defines required by that validation target
;   - exceptional compile-test overrides
;
; ============================================================================


; ============================================================================
; BASIC VALIDATION
; ============================================================================
;
; Can PulSar compile for this chipset / hardware class?
; ============================================================================


; ============================================================================
; ESP8266 - Minimal NodeMCU - 1 MB - NO FILESYSTEM
; ============================================================================

[env:valid__esp8266__minimal__nodemcu_nofs1m]
extends = base_esp8266
board = nodemcuv2
board_build.ldscript = eagle.flash.1m.ld
build_flags = ${base_esp8266.build_flags}
              -D USER_MICHAEL
              -D DEVICE_VALIDATION__ESP8266__MINIMAL__NODEMCU
              -D DISABLE_MODULE_CORE_FILESYSTEM


; ============================================================================
; ESP8266 - Minimal NodeMCU - 1 MB - FILESYSTEM
; ============================================================================

[env:valid__esp8266__minimal__nodemcu_withfs1m]
extends = base_esp8266
board = nodemcuv2
board_build.ldscript = eagle.flash.1m.ld
board_build.filesystem = littlefs
build_flags = ${base_esp8266.build_flags}
              -D USER_MICHAEL
              -D DEVICE_VALIDATION__ESP8266__MINIMAL__NODEMCU


; ============================================================================
; ESP8266 - Minimal NodeMCU - 4 MB - FILESYSTEM
; ============================================================================

[env:valid__esp8266__minimal__nodemcu_withfs4m]
extends = base_esp8266
board = nodemcuv2
board_build.ldscript = eagle.flash.4m1m.ld
board_build.filesystem = littlefs
build_flags = ${base_esp8266.build_flags}
              -D USER_MICHAEL
              -D DEVICE_VALIDATION__ESP8266__MINIMAL__NODEMCU


; ============================================================================
; ESP32 - Minimal DevKit
; ============================================================================

[env:valid__esp32__minimal__devkit]
extends = base_esp32
build_flags = ${base_esp32.build_flags}
              -D USER_MICHAEL
              -D DEVICE_VALIDATION__ESP32__MINIMAL_DEVKIT
              -D FIRMWARE_DEFAULT__WEBSERVER__ADVANCED
              '-DDEVICENAME_CTR="validation"'
              '-DDEVICENAME_FRIENDLY_CTR="Validation#Desk"'


; ============================================================================
; ESP32-C3 - Minimal SuperMini
; ============================================================================

[env:valid__esp32c3__minimal_supermini]
extends = base_esp32c3
build_flags = ${base_esp32c3.build_flags}
              -D USER_MICHAEL
              -D DEVICE_VALIDATION__ESP32C3__MINIMAL_SUPERMINI
              -D FIRMWARE_DEFAULT__WEBSERVER__ADVANCED
              -D I2C_BUS_SPEED=400000
              '-DDEVICENAME_CTR="validation"'
              '-DDEVICENAME_FRIENDLY_CTR="Validation#Desk"'
              -D ENABLE_DEBUG_MODULE_HARDWAREPINS_SUBSECTION_TEMPLATES
              -D LD2410_DEFAULT_SERIAL_NUMBER=1


; ============================================================================
; ESP32-S3 - Seeed XIAO Sense / Camera
; ============================================================================

[env:valid__esp32s3__minimal_seedxiaocam]
extends = base_esp32s3
board = seeed_xiao_esp32s3
board_build.psram = enabled
build_flags = ${base_esp32s3.build_flags}
              -D USER_MICHAEL
              -D DEVICE_VALIDATION__ESP32S3__MINIMAL_SEEDSTUDIO_XIAO_CAMERA
              -D USE_MODULE_TEMPLATE__CAMERA_XIAO_ESP32S3_SENSE
              -D DISABLE_LEDC_DEFINE_TO_PATCH_BUILD_ERROR_JUNE25
              -D CAMERA_MODEL_XIAO_ESP32S3_SENSE
              -D FIRMWARE_DEFAULT__WEBSERVER__ADVANCED
              -D ENABLE_DEVFEATURE_ANALOG_WRITE_EMULATION_VERSION2
              '-DDEVICENAME_CTR="validation"'
              '-DDEVICENAME_FRIENDLY_CTR="Validation#Desk"'
              -D I2C_BUS_SPEED=400000
              -D BOARD_HAS_PSRAM
              -D ENABLE_DEBUG_MODULE_HARDWAREPINS_SUBSECTION_TEMPLATES
              -Ilib/lib_esp32_camera2/driver/private_include
              -Ilib/lib_esp32_camera2/driver/include
              -Ilib/lib_esp32_camera2/conversions


; ============================================================================
; ESP32 - WROVER-E Camera
; ============================================================================

[env:valid__esp32__camera_wroover_e]
extends = base_esp32
board = esp32dev
board_build.flash_mode = dio
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.psram = enabled
board_build.partitions = partitions/esp32_default.csv
lib_ldf_mode = chain+
build_flags = ${base_esp32.build_flags}
              -D USER_MICHAEL
              -D DEVICE_VALIDATION__ESP32__CAMERA_WROOVER_E
              -D USE_MODULE_DRIVERS__CAMERA
              -D ENABLE_DEVFEATURE_ANALOG_WRITE_EMULATION_VERSION2
              -D I2C_BUS_SPEED=400000
              -D BOARD_HAS_PSRAM
              '-DDEVICENAME_CTR="validation_cam_wroover"'
              '-DDEVICENAME_FRIENDLY_CTR="validation_cam_wroover#Desk"'
              -D SETTINGS_LOCATION=0x300000
              -D SETTINGS_SIZE=0x10000
              -D Serial=Serial0
              -D ENABLE_DEBUG_LINE_HERE3
              -D ENABLE_DEBUG_MANUAL_DELAYS
              -D ENABLE_DEBUGFEATURE_LOGS__FORCE_FLUSH_ON_TRANSMIT
              -D DISABLE_LEDC_DEFINE_TO_PATCH_BUILD_ERROR_JUNE25
              -D ENABLE_IMMEDIATE_BOOT_SERIAL_PRINT_WHILE
              -D ENABLE_DEBUG_MODULE_HARDWAREPINS_SUBSECTION_TEMPLATES
              -Ilib/lib_esp32_camera2/driver/private_include
              -Ilib/lib_esp32_camera2/driver/include
              -Ilib/lib_esp32_camera2/conversions


; ============================================================================
; ESP32 - Ethernet
; ============================================================================

[env:valid__esp32__ethernet]
extends = base_esp32
build_flags = ${base_esp32.build_flags}
              -D USER_MICHAEL
              -D DEVICE_VALIDATION__ESP32__ETHERNET
              -D FIRMWARE_DEFAULT__WEBSERVER__ADVANCED
              '-DDEVICENAME_CTR="validation_ethernet"'
              '-DDEVICENAME_FRIENDLY_CTR="Validation#Desk"'


; ============================================================================
; COMMON VALIDATION
; ============================================================================
;
; Representative PulSar configurations rather than basic chipset tests.
; ============================================================================


; ============================================================================
; ESP32 - Lighting Basic
; ============================================================================

[env:valid__esp32__lgt_basic]
extends = base_esp32
build_flags = ${base_esp32.build_flags}
              -D USER_MICHAEL
              -D DEVICE_VALIDATION__ESP32__LIGHTING__1D_SINGLE_BUS
              -D FIRMWARE_DEFAULT__LIGHTING_CONFIG__COMPLETE
              -D FIRMWARE_DEFAULT__LIGHTING_CONFIG__BETA
              -D STRIP_DEFAULT_LENGTH=100
              -D ENABLE_DEBUGFEATURE_LIGHTS__SEGMENT_BRIGHTNESS_LIMIT_VALUE=15
              '-DDEVICENAME_CTR="validation"'
              '-DDEVICENAME_FRIENDLY_CTR="Validation#Desk"'


; ============================================================================
; ESP32 - All Sensors
; Compile coverage environment - not intended to represent real hardware.
; ============================================================================

[env:valid__esp32__sensors_all]
extends = base_esp32
build_flags = ${base_esp32.build_flags}
              -D USER_MICHAEL
              -D DEVICE_VALIDATION__ESP32__SENSORS_ALL
              -D FIRMWARE_DEFAULT__WEBSERVER__ADVANCED
              '-DDEVICENAME_CTR="validation"'
              '-DDEVICENAME_FRIENDLY_CTR="Validation#Desk"'


; ============================================================================
; ESP32 - All Drivers
; Compile coverage environment - not intended to represent real hardware.
; ============================================================================

[env:valid__esp32__drivers_all]
extends = base_esp32
build_flags = ${base_esp32.build_flags}
              -D USER_MICHAEL
              -D DEVICE_VALIDATION__ESP32__DRIVERS_ALL
              -D FIRMWARE_DEFAULT__WEBSERVER__ADVANCED
              '-DDEVICENAME_CTR="validation"'
              '-DDEVICENAME_FRIENDLY_CTR="Validation#Desk"'
              -D ENABLE_DEBUGFEATURE_LOGS__FORCE_FLUSH_ON_TRANSMIT
              -D DISABLE_LEDC_DEFINE_TO_PATCH_BUILD_ERROR_JUNE25
              -D ENABLE_IMMEDIATE_BOOT_SERIAL_PRINT_WHILE
              -D ENABLE_DEVFEATURE_ANALOG_WRITE_EMULATION_VERSION2
              -D ENABLE_DEVFEATURE_ESP32__AUTO_MUTEX
              -D BOARD_HAS_PSRAM
              -D SETTINGS_LOCATION=0x300000
              -D SETTINGS_SIZE=0x10000
              -D Serial=Serial0
              -D ENABLE_DEBUG_MODULE_HARDWAREPINS_SUBSECTION_TEMPLATES
              -Ilib/lib_esp32_camera2/driver/private_include
              -Ilib/lib_esp32_camera2/driver/include
              -Ilib/lib_esp32_camera2/conversions
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = partitions_inspect.csv


; ============================================================================
; ESP32 - All Modules
; Maximum compile coverage - deliberately not constrained to real hardware.
; ============================================================================

[env:valid__esp32__modules_all]
extends = base_esp32
build_flags = ${base_esp32.build_flags}
              -D USER_MICHAEL
              -D DEVICE_VALIDATION__ESP32__MODULES_ALL
              -D FIRMWARE_DEFAULT__WEBSERVER__ADVANCED
              '-DDEVICENAME_CTR="validation"'
              '-DDEVICENAME_FRIENDLY_CTR="Validation#Desk"'
              -D ENABLE_DEBUGFEATURE_LOGS__FORCE_FLUSH_ON_TRANSMIT
              -D DISABLE_LEDC_DEFINE_TO_PATCH_BUILD_ERROR_JUNE25
              -D ENABLE_IMMEDIATE_BOOT_SERIAL_PRINT_WHILE
              -D ENABLE_DEVFEATURE_ANALOG_WRITE_EMULATION_VERSION2
              -D ENABLE_DEVFEATURE_ESP32__AUTO_MUTEX
              -D BOARD_HAS_PSRAM
              -D SETTINGS_LOCATION=0x300000
              -D SETTINGS_SIZE=0x10000
              -D Serial=Serial0
              -D ENABLE_DEBUG_MODULE_HARDWAREPINS_SUBSECTION_TEMPLATES
              -Ilib/lib_esp32_camera2/driver/private_include
              -Ilib/lib_esp32_camera2/driver/include
              -Ilib/lib_esp32_camera2/conversions
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions_inspect.csv



















