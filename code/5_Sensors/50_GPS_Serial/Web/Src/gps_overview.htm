<html lang="en">
<head>

  <script src="/common.js"></script>
  <style>@import url("/style.css");</style>

  <script>
    // Date Modified: 12Apr26

    const POLL_SECONDS = 1;
    var poll_timer = 0;

    function S() {
      getLoc();

      if (loc) d.Sf.action = getURL("/m/gpsoverview");

      PollNow();
    }

    function PollNow() {
      loadJS(getURL("/m/gpsoverview/s.js?p=1&ts=" + Date.now()), false);
      if (typeof GetV === "function") GetV();
      PollSchedule();
    }

    function PollSchedule() {
      if (poll_timer) clearTimeout(poll_timer);
      poll_timer = setTimeout(PollNow, POLL_SECONDS * 1000);
    }
  </script>
</head>
