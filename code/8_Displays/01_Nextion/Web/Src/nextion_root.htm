<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Nextion Control</title>

  <link rel="stylesheet" href="/pulsar.css">
  <script src="/pulsar.js"></script>
</head>


<body class="page">

  <header class="page-header">
    <div class="page-title">
      <h1>Nextion Panel</h1>
      <div class="page-subtitle">Display control and maintenance</div>
    </div>

    <div class="page-actions">
      <button onclick="go('/')">Back</button>
    </div>
  </header>


  <section class="card">
    <h2>Firmware</h2>

    <p class="muted">
      Update or reflash the connected Nextion LCD.
    </p>

    <div class="page-actions">
      <button class="primary" onclick="go('/nextion/firmware')">
        Open Firmware Update
      </button>
    </div>
  </section>


  <section class="card">
    <h2>Commands</h2>

    <p class="muted">
      Send raw commands directly to the Nextion panel.
    </p>

    <div class="page-actions">
      <button onclick="go('/nextion/command')">
        Open Command Console
      </button>
    </div>
  </section>

</body>

</html>
