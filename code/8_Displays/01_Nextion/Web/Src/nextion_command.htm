<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Nextion Command Console</title>

  <link rel="stylesheet" href="/pulsar.css">
  <script src="/pulsar.js"></script>
</head>


<body class="page">

  <header class="page-header">

    <div class="page-title">
      <h1>Nextion Command Console</h1>
      <div class="page-subtitle">
        Direct panel command interface
      </div>
    </div>

    <div class="page-actions">
      <button onclick="go('/nextion')">Back</button>
    </div>

  </header>


  <section class="card">

    <h2>Send Command</h2>

    <p class="muted">
      Send a raw command directly to the Nextion display.
      The standard <code>0xFF 0xFF 0xFF</code> suffix is appended automatically.
    </p>

    <form method="get" action="/nextion/cmd">

      <div class="form-row">

        <label for="cmd">
          Command
        </label>

        <input
          type="text"
          id="cmd"
          name="cmd"
          placeholder="e.g. page main"
          autocomplete="off"
          required
        >

      </div>

      <div class="page-actions">
        <button type="submit" class="primary">
          Send Command
        </button>
      </div>

    </form>

  </section>


  <section class="card">

    <h2>Panel Control</h2>

    <p class="muted">
      Maintenance commands for the connected display.
    </p>

    <form method="get" action="/nextion/reboot_panel">

      <div class="page-actions">
        <button type="submit" class="danger">
          Reboot Nextion Panel
        </button>
      </div>

    </form>

  </section>

</body>

</html>
