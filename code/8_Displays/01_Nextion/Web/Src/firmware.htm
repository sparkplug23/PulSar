<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Nextion Firmware Update</title>

  <link rel="stylesheet" href="/pulsar.css">
  <script src="/pulsar.js"></script>
</head>


<body class="page">

  <header class="page-header">

    <div class="page-title">
      <h1>Nextion Firmware Update</h1>
      <div class="page-subtitle">
        Update the connected Nextion LCD
      </div>
    </div>

    <div class="page-actions">
      <button onclick="go('/nextion')">Back</button>
    </div>

  </header>


  <section class="card">

    <h2>Update from File</h2>

    <p class="muted">
      Upload a local Nextion <code>.tft</code> firmware file.
    </p>

    <form
      method="POST"
      action="/nextion/lcdupload"
      enctype="multipart/form-data"
    >

      <div class="form-row">

        <label for="lcdSelect">
          TFT File
        </label>

        <input
          type="file"
          id="lcdSelect"
          name="files[]"
          accept=".tft"
          required
        >

      </div>

      <div class="page-actions">

        <button
          type="submit"
          class="primary"
          id="lcdUploadSubmit"
        >
          Update LCD from File
        </button>

      </div>

    </form>

  </section>


  <section class="card">

    <h2>Update from URL</h2>

    <p class="muted">
      Download a Nextion TFT firmware file directly from a remote HTTP or HTTPS URL.
    </p>

    <form method="GET" action="/nextion/lcddownload">

      <div class="form-row">

        <label for="lcdFirmwareUrl">
          TFT URL
        </label>

        <input
          type="url"
          id="lcdFirmwareUrl"
          name="lcdFirmware"
          placeholder="https://example.com/display.tft"
          required
        >

      </div>

      <div class="page-actions">

        <button
          type="submit"
          class="primary"
          id="lcdUrlSubmit"
        >
          Update LCD from URL
        </button>

      </div>

    </form>

  </section>


  <script>

    function handleLcdFileSelect(event)
    {
      const file = event.target.files[0];

      if(!file) return;

      setText(
        'lcdUploadSubmit',
        'Upload ' + file.name
      );

      fetch(
        '/nextion/tftFileSize?tftFileSize=' +
        encodeURIComponent(file.size),
        {
          method: 'GET',
          cache: 'no-store'
        }
      ).catch(()=>{});
    }


    onReady(()=>{
      const file = gId('lcdSelect');
      const upload = gId('lcdUploadSubmit');
      const url = gId('lcdUrlSubmit');

      if(file)
      {
        file.addEventListener(
          'change',
          handleLcdFileSelect
        );
      }

      if(upload)
      {
        upload.addEventListener('click', ()=>{
          setText(
            upload,
            'Uploading LCD firmware...'
          );
        });
      }

      if(url)
      {
        url.addEventListener('click', ()=>{
          setText(
            url,
            'Starting URL download...'
          );
        });
      }
    });

  </script>

</body>

</html>
