<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Nextion Firmware Update</title>

  <!-- Shared styling -->
  <link rel="stylesheet" href="/submodule_style.css">
</head>

<body>
  <div class="wrap">
    <h1 id="deviceName">Device</h1>
    <hr>
    <h2>Nextion Firmware Update</h2>

    <!-- ========================================================= -->
    <!-- Local TFT upload                                          -->
    <!-- ========================================================= -->
    <div class="card">
      <b>Update Nextion LCD from file</b>

      <form method="POST"
            action="/nextion/lcdupload"
            enctype="multipart/form-data">

        <div class="row">
          <div style="flex: 1 1 420px;">
            <label for="lcdSelect">TFT file</label>
            <input type="file"
                   id="lcdSelect"
                   name="files[]"
                   accept=".tft"
                   required>
          </div>

          <div style="flex: 0 0 auto; align-self: end;">
            <button type="submit"
                    class="primary"
                    id="lcdUploadSubmit"
                    onclick="ackLcdUploadSubmit()">
              Update LCD from file
            </button>
          </div>
        </div>

        <div class="small hint">
          File size is sent to <code>/nextion/tftFileSize</code> before upload.
        </div>
      </form>
    </div>

    <!-- ========================================================= -->
    <!-- TFT update from URL                                       -->
    <!-- ========================================================= -->
    <div class="card">
      <b>Update Nextion LCD from URL</b>

      <div class="small hint">
        https://raw.githubusercontent.com/&lt;user&gt;/&lt;repo&gt;/&lt;branch&gt;/path/file.tft
      </div>

      <form method="GET" action="/nextion/lcddownload">
        <div class="row">
          <div style="flex: 1 1 520px;">
            <label for="lcdFirmwareUrl">TFT URL</label>
            <input type="url"
                   id="lcdFirmwareUrl"
                   name="lcdFirmware"
                   required>
          </div>

          <div style="flex: 0 0 auto; align-self: end;">
            <button type="submit"
                    class="primary"
                    id="lcdUrlSubmit"
                    onclick="ackLcdUrlSubmit()">
              Update LCD from URL
            </button>
          </div>
        </div>

        <div class="small">
          Available only when
          <code>ENABLE_DEBUGFEATURE_NEXTION__LCD_UPDATE_VIA_URL</code>
          is enabled.
        </div>
      </form>
    </div>

    <script>
      function handleLcdFileSelect(evt) {
        var file = evt.target.files[0];
        if (!file) return;

        document.getElementById('lcdUploadSubmit').innerHTML =
          'Upload LCD firmware ' + file.name;

        var req = new XMLHttpRequest();
        req.open(
          'GET',
          '/nextion/tftFileSize?tftFileSize=' + file.size,
          true
        );
        req.send();
      }

      function ackLcdUploadSubmit() {
        document.getElementById('lcdUploadSubmit').innerHTML =
          'Uploading LCD firmware...';
      }

      function ackLcdUrlSubmit() {
        var el = document.getElementById('lcdUrlSubmit');
        if (el) el.innerHTML = 'Starting URL download...';
      }

      var lcdEl = document.getElementById('lcdSelect');
      if (lcdEl) {
        lcdEl.addEventListener('change', handleLcdFileSelect, false);
      }
    </script>
  </div>
</body>
</html>
