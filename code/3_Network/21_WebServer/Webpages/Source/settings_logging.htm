<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no" name="viewport">
	<title>Logging Settings</title>
	<style>html{visibility:hidden}</style>
	<script>
		(function loadFiles(){const l=document.createElement('script');l.src='/common.js';l.onload=()=>loadResources(['/style.css'],S);l.onerror=()=>setTimeout(loadFiles,100);document.head.appendChild(l);})();
		function S(){getLoc();}
	</script>
</head>
<body>
<form id="form_s" name="Sf" method="post">
<div class="toprow"><button type="button" onclick="B()">Back</button><button type="submit">Save</button><hr></div>
<h2>Logging</h2>

<div class="sec">
<h3>Log Levels</h3>
Serial: <select name="LOG_SERIAL"><option>Disabled</option><option>Error</option><option>Info</option><option>Debug</option></select><br>
Web: <select name="LOG_WEB"><option>Disabled</option><option>Error</option><option>Info</option><option>Debug</option></select><br>
</div>

<div class="sec">
<h3>Console</h3>
<button type="button" onclick="window.location=getURL('/console')">Open Console</button>
</div>

<div class="sec">
<h3>Diagnostics</h3>
<button type="button" onclick="window.location=getURL('/debug/main')">Debug Information</button>
<button type="button" onclick="window.location=getURL('/url_list')">Registered URLs</button>
</div>

<hr><button type="button" onclick="B()">Back</button><button type="submit">Save</button>
</form>
<div id="toast"></div>
</body>
</html>
