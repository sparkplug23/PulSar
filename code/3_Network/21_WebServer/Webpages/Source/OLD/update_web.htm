<!DOCTYPE html>
<html>
<head>
  <meta content="width=device-width" name="viewport">
  <title>PulSar Update</title>

  <script src="/common.js"></script>

  <script>
    function U() {
      var uf = gId("uf");
      var msg = gId("msg");
      var btn = gId("btn_update");

      if (uf) uf.style.display = "none";
      if (msg) msg.style.display = "block";
      if (btn) btn.disabled = true;

      return true;
    }

    function InitUpdatePage() {
      getLoc();
    }
  </script>

  <style>
    @import url("/style.css");

    #msg {
      display: none;
      margin-top: 1.5em;
    }

    input[type="file"] {
      margin-top: 1em;
      margin-bottom: 1em;
      max-width: 100%;
    }

    button {
      margin-top: 0.4em;
    }

    .warn {
      margin-top: 1em;
      margin-bottom: 1em;
      font-size: 0.9em;
      opacity: 0.85;
    }

    code {
      opacity: 0.9;
    }
  </style>
</head>

<body onload="InitUpdatePage()">
  <h2>PulSar Software Update</h2>

  <form method="POST" action="/update" id="uf" enctype="multipart/form-data" onsubmit="return U()">
    <div class="warn">
      Select the compiled firmware <code>.bin</code> file for this exact device.
      The device will reboot automatically after a successful update.
    </div>

    <input type="file" name="update" required><br>

    <button id="btn_update" type="submit">Update</button><br>
    <button type="button" onclick="B()">Back</button>
  </form>

  <div id="msg">
    <b>Updating...</b><br>
    Please do not close or refresh the page.
  </div>
</body>
</html>
