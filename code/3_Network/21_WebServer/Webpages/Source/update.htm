<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no" name="viewport">
	<title>PulSar Firmware Update</title>

	<style>html{visibility:hidden}</style>
	<script>
		(function loadFiles(){
			const l=document.createElement('script');
			l.src='/common.js';
			l.onload=()=>loadResources(['/style.css'],S);
			l.onerror=()=>setTimeout(loadFiles,100);
			document.head.appendChild(l);
		})();

		function S(){getLoc();}

		function U(){
			gId("uf").style.display="none";
			gId("msg").style.display="block";
			return true;
		}
	</script>
</head>

<body>
<h2>Firmware Update</h2>

<form method="POST" action="/update" id="uf" enctype="multipart/form-data" onsubmit="return U()">

<div class="sec">
	<h3>Upload Firmware</h3>
	Select the compiled firmware binary for this device.<br>
	<input type="file" name="update" accept=".bin,application/octet-stream" required><br>
	<button type="submit">Upload & Flash</button>
</div>

<button type="button" onclick="B()">Back</button>
</form>

<div id="msg" class="sec" style="display:none">
	<h3>Updating...</h3>
	Please do not close or refresh this page.<br>
	The device will restart when the update is complete.
</div>

<div id="toast"></div>
</body>
</html>
