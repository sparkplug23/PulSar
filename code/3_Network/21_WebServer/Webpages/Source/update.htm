<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Firmware Update</title>

  <link rel="stylesheet" href="/pulsar.css">

  <script src="/pulsar.js"></script>
  <script src="/pulsar_data.js"></script>
</head>


<body class="settings-page">
<header class="page-header"><div class="page-title"><h1>Firmware Update</h1></div><button onclick="go('/settings')">Back</button></header>

<form method="POST" action="/update" id="uf" enctype="multipart/form-data" onsubmit="show('uf',false);show('msg');">
<section class="settings-section"><h2>Upload Firmware</h2>
<p class="muted">Select the compiled firmware binary for this device.</p>
<p><input type="file" name="update" accept=".bin,application/octet-stream" required></p>
<button class="primary">Upload &amp; Flash</button>
</section>
</form>

<section id="msg" class="settings-section hide"><h2>Updating…</h2><p>Please do not close or refresh this page. The device will restart when complete.</p></section>
</body></html>
