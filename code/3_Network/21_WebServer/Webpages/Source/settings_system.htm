<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>System Settings</title>
<link rel="stylesheet" href="/pulsar.css"><script defer src="/pulsar.js"></script>
</head>
<body class="settings-page"><form id="form_s" name="Sf" method="post">

<header class="page-header"><div class="page-title"><h1>System</h1><div class="page-subtitle">Identity, time and runtime state</div></div><div class="page-actions"><button type="button" onclick="go('/settings')">Back</button><button class="primary">Save</button></div></header>

<section class="settings-section"><h2>Device</h2>
<label class="setting"><span>Device name</span><input name="SYS_NAME" maxlength="32"></label>
<label class="setting"><span>Friendly name</span><input name="SYS_FRIENDLY" maxlength="64"></label>
</section>

<section class="settings-section"><h2>Time</h2>
<label class="setting"><span>Use NTP</span><input name="NTP_EN" type="checkbox"></label>
<label class="setting"><span>NTP server</span><input name="NTP_SERVER" maxlength="64"></label>
<label class="setting"><span>24-hour format</span><input name="TIME_24H" type="checkbox"></label>
<label class="setting"><span>Time zone</span><select name="TZ"><option value="0">UTC</option><option value="1">GMT/BST</option></select></label>
<label class="setting"><span>UTC offset</span><input name="UTC_OFFSET" type="number"></label>
</section>

<section class="settings-section"><h2>Location</h2>
<label class="setting"><span>Latitude</span><input name="LAT" type="number" step=".000001" min="-90" max="90"></label>
<label class="setting"><span>Longitude</span><input name="LON" type="number" step=".000001" min="-180" max="180"></label>
</section>

<section class="settings-section"><h2>Runtime</h2><div class="kv">
<div class="kv-row"><div class="kv-key">Uptime</div><div class="kv-value" id="sys_uptime">Unknown</div></div>
<div class="kv-row"><div class="kv-key">Boot count</div><div class="kv-value" id="sys_boots">Unknown</div></div>
<div class="kv-row"><div class="kv-key">Reset reason</div><div class="kv-value" id="sys_reset">Unknown</div></div>
<div class="kv-row"><div class="kv-key">Firmware</div><div class="kv-value" id="sys_fw">Unknown</div></div>
</div></section>

<section class="settings-section"><h2>System Control</h2><button type="button" onclick="go('/reboot')">Restart Device</button></section>

</form><div id="toast"></div></body></html>
