<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no" name="viewport">
	<title>Hardware Settings</title>
	<style>html{visibility:hidden}</style>
	<script>
		(function loadFiles(){const l=document.createElement('script');l.src='/common.js';l.onload=()=>loadResources(['/style.css'],S);l.onerror=()=>setTimeout(loadFiles,100);document.head.appendChild(l);})();
		function S(){getLoc();}
	</script>
</head>
<body>
<form id="form_s" name="Sf" method="post">
<div class="toprow"><button type="button" onclick="B()">Back</button><button type="submit">Save</button><hr></div>
<h2>Hardware</h2>

<div class="sec">
<h3>GPIO / Pin Manager</h3>
<div id="gpio_table"><i>Configured GPIO assignments will appear here.</i></div>
<button type="button">Configure Pins</button>
</div>

<div class="sec">
<h3>I²C</h3>
Enabled: <input name="I2C_EN" type="checkbox"><br>
SDA: <input name="I2C_SDA" type="number" class="s" min="-1" max="99"><br>
SCL: <input name="I2C_SCL" type="number" class="s" min="-1" max="99"><br>
Frequency: <input name="I2C_FREQ" type="number"> Hz<br>
</div>

<div class="sec">
<h3>SPI</h3>
Enabled: <input name="SPI_EN" type="checkbox"><br>
MOSI: <input name="SPI_MOSI" type="number" class="s" min="-1" max="99"><br>
MISO: <input name="SPI_MISO" type="number" class="s" min="-1" max="99"><br>
SCLK: <input name="SPI_SCLK" type="number" class="s" min="-1" max="99"><br>
</div>

<div class="sec">
<h3>Serial / UART</h3>
<div id="uart_instances"><i>Configured UART instances will appear here.</i></div>
<button type="button">Add Serial Interface</button>
</div>

<div class="sec">
<h3>Hardware Information</h3>
Board: <span id="hw_board">Unknown</span><br>
Chip: <span id="hw_chip">Unknown</span><br>
Flash: <span id="hw_flash">Unknown</span><br>
PSRAM: <span id="hw_psram">Unknown</span><br>
</div>

<hr><button type="button" onclick="B()">Back</button><button type="submit">Save</button>
</form>
<div id="toast"></div>
</body>
</html>
