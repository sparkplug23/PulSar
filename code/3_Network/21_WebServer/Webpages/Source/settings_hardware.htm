<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hardware Settings</title>
  <link rel="stylesheet" href="/pulsar.css">

  <script src="/pulsar.js"></script>
  <script src="/pulsar_data.js"></script>
</head>
<body class="settings-page">
<form id="form_s" name="Sf" method="post">

<header class="page-header"><div class="page-title"><h1>Hardware</h1><div class="page-subtitle">GPIO, buses and physical interfaces</div></div><div class="page-actions"><button type="button" onclick="go('/settings')">Back</button><button class="primary">Save</button></div></header>

<section class="settings-section"><h2>GPIO / Pin Manager</h2><div id="gpio_table" class="empty">Configured GPIO assignments will appear here.</div><button type="button">Configure Pins</button></section>

<section class="settings-section"><h2>I²C</h2>
<label class="setting"><span>Enabled</span><input name="I2C_EN" type="checkbox"></label>
<label class="setting"><span>SDA</span><input name="I2C_SDA" type="number" min="-1" max="99"></label>
<label class="setting"><span>SCL</span><input name="I2C_SCL" type="number" min="-1" max="99"></label>
<label class="setting"><span>Frequency</span><input name="I2C_FREQ" type="number"></label>
</section>

<section class="settings-section"><h2>SPI</h2>
<label class="setting"><span>Enabled</span><input name="SPI_EN" type="checkbox"></label>
<label class="setting"><span>MOSI</span><input name="SPI_MOSI" type="number" min="-1" max="99"></label>
<label class="setting"><span>MISO</span><input name="SPI_MISO" type="number" min="-1" max="99"></label>
<label class="setting"><span>SCLK</span><input name="SPI_SCLK" type="number" min="-1" max="99"></label>
</section>

<section class="settings-section"><h2>Serial / UART</h2><div id="uart_instances" class="empty">Configured UART instances will appear here.</div><button type="button">Add Serial Interface</button></section>

<section class="settings-section"><h2>Hardware Information</h2><div class="kv">
<div class="kv-row"><div class="kv-key">Board</div><div class="kv-value" id="hw_board">Unknown</div></div>
<div class="kv-row"><div class="kv-key">Chip</div><div class="kv-value" id="hw_chip">Unknown</div></div>
<div class="kv-row"><div class="kv-key">Flash</div><div class="kv-value" id="hw_flash">Unknown</div></div>
<div class="kv-row"><div class="kv-key">PSRAM</div><div class="kv-value" id="hw_psram">Unknown</div></div>
</div></section>

</form><div id="toast"></div>
</body></html>
