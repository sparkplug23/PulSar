<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>System Controls</title>
<link rel="stylesheet" href="/pulsar.css"><script defer src="/pulsar.js"></script><script defer src="/pulsar_data.js"></script>
</head>
<body class="data-page">

<header class="page-header"><div class="page-title"><h1>System Controls</h1></div><div class="page-actions"><span id="status" class="status">Ready</span><button onclick="refreshAll()">Refresh</button><button id="pause" onclick="togglePause()">Pause</button><button onclick="go('/')">Back</button></div></header>

<section class="section"><h2>Sensors</h2><div id="c1" class="empty">Loading…</div></section>
<section class="section"><h2>Drivers</h2><div id="c2" class="empty">Loading…</div></section>
<section class="section"><h2>Controllers</h2><div id="c3" class="empty">Loading…</div></section>

<script>
let paused=false,pollers=[];

async function load(id){
 if(paused)return;
 try{setHTML(id,await getText('/system/controls/'+id+'?t='+Date.now()));setStatus('status','OK','ok');}
 catch(e){setHTML(id,'<div class="error">Failed to load</div>');setStatus('status','Error','bad');}
}

function refreshAll(){load('c1');load('c2');load('c3');}

function togglePause(){
 paused=!paused;setText('pause',paused?'Resume':'Pause');gId('pause').classList.toggle('active',paused);
 if(!paused)refreshAll();
}

onReady(()=>{
 refreshAll();
 pollers=[createPoller(()=>load('c1'),2000),createPoller(()=>load('c2'),5000),createPoller(()=>load('c3'),10000)];
 pollers.forEach(x=>x.start(false));
});

addEventListener('pagehide',()=>pollers.forEach(x=>x.stop()));
</script>
</body></html>
