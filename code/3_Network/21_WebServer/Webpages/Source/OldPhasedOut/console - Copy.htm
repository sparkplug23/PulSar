<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1">
<meta name="theme-color" content="#222222">
<title>PulSar Console</title>

<style>
  /* Date Modified: 30Dec25 */
  :root{
    --bg:#141414;
    --panel:#1d1d1d;
    --border:#333;
    --text:#e6e6e6;
    --muted:#a8a8a8;
    --btn:#2a2a2a;
    --btn2:#3a3a3a;
    --accent:#4da3ff;
    --danger:#ff5c5c;
  }
  html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:Segoe UI,Roboto,Arial,sans-serif;}
  .top{
    position:fixed;left:0;right:0;top:0;
    display:flex;gap:8px;align-items:center;
    padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--border);
    z-index:10;
  }
  .top .sp{flex:1}
  button{
    background:var(--btn);color:var(--text);
    border:1px solid var(--border);border-radius:6px;
    padding:7px 10px;font-size:14px;cursor:pointer;
  }
  button:hover{background:var(--btn2)}
  button:active{transform:translateY(1px)}
  button.danger{border-color:#552222;background:#2a1717}
  button.danger:hover{background:#3a2020}
  .pill{
    border:1px solid var(--border);border-radius:999px;
    padding:6px 10px;font-size:12px;color:var(--muted);
    background:#101010;
    white-space:nowrap;
  }
  .main{
    position:fixed;left:0;right:0;top:52px;bottom:54px;
    padding:10px;
  }
  #log{
    width:100%;height:100%;
    box-sizing:border-box;
    background:#0f0f0f;color:var(--text);
    border:1px solid var(--border);border-radius:8px;
    padding:10px;
    font-family:Consolas,Menlo,Monaco,monospace;
    font-size:12px;line-height:1.35;
    white-space:pre-wrap;word-break:break-word;
    overflow:auto;
  }
  .bottom{
    position:fixed;left:0;right:0;bottom:0;
    display:flex;gap:8px;align-items:center;
    padding:8px 10px;background:var(--panel);border-top:1px solid var(--border);
  }
  #cmd{
    flex:1;
    background:#0f0f0f;color:var(--text);
    border:1px solid var(--border);border-radius:8px;
    padding:9px 10px;font-size:14px;
    outline:none;
  }
  #cmd::placeholder{color:#777}
  .hint{color:var(--muted);font-size:12px}
  .chk{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;user-select:none}
  input[type="checkbox"]{width:16px;height:16px}
</style>
</head>

<body>

<div class="top">
  <button id="btnRefresh">Refresh</button>
  <button id="btnClear" class="danger">Clear</button>

  <label class="chk"><input id="chkAuto" type="checkbox" checked>Auto</label>
  <label class="chk"><input id="chkScroll" type="checkbox" checked>Scroll</label>

  <span class="pill" id="stat">idx:0, last:—</span>
  <span class="sp"></span>
  <span class="hint" id="urlHint"></span>
</div>

<div class="main">
  <div id="log"></div>
</div>

<div class="bottom">
  <input id="cmd" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"
         placeholder="Command, e.g. status, restart, loglevel 3 ...">
  <button id="btnSend">Send</button>
</div>

<script>
/* Date Modified: 30Dec25 */

/**
 * Console endpoint:
 * - Defaults to the current page path (works whether served as /console or /dev/console).
 * - If you want to hardcode: set CONSOLE_URL = "/console";
 */
let CONSOLE_URL = location.pathname || "/console";

/**
 * Protocol: GET ?c2=<counter> returns:
 *   <web_log_index>}1<reset_flag>}1<log lines...>}1
 */
let counter = 0;
let lastPollMs = 0;
let pollTimer = 0;

const elLog  = document.getElementById("log");
const elCmd  = document.getElementById("cmd");
const elStat = document.getElementById("stat");
const elHint = document.getElementById("urlHint");

const chkAuto   = document.getElementById("chkAuto");
const chkScroll = document.getElementById("chkScroll");

function nowStr(){
  const d = new Date();
  return d.toLocaleTimeString();
}

function setStatus(idx){
  elStat.textContent = `idx:${idx}, last:${nowStr()}`;
}

function appendLog(text){
  if (!text) return;

  // append with newline if needed
  const wasAtBottom = (elLog.scrollTop + elLog.clientHeight + 5) >= elLog.scrollHeight;

  elLog.textContent += (elLog.textContent.length ? "\n" : "") + text;

  if (chkScroll.checked && (wasAtBottom || chkAuto.checked)) {
    elLog.scrollTop = elLog.scrollHeight;
  }
}

function clearLog(){
  elLog.textContent = "";
}

function buildUrl(params){
  const u = new URL(CONSOLE_URL, location.origin);
  Object.keys(params).forEach(k => u.searchParams.set(k, params[k]));
  // Cache-bust to avoid any intermediates doing something “helpful”
  u.searchParams.set("_cb", Date.now());
  return u.toString();
}

async function pollOnce(){
  try {
    const url = buildUrl({ c2: String(counter) });
    const r = await fetch(url, { method:"GET", cache:"no-store" });
    if (!r.ok) return;

    const t = await r.text();

    // Expect: idx}1reset}1log}1
    const parts = t.split("}1");
    if (parts.length < 3) return;

    const idx   = parseInt(parts[0] || "0", 10) || 0;
    const rflag = parseInt(parts[1] || "0", 10) || 0;

    // Everything between parts[2] .. parts[n-2] is log text (usually only parts[2])
    // Join back in case the log itself contained "}1" (rare, but safe).
    const logText = parts.slice(2, parts.length - 1).join("}1").trim();

    // Update counter
    counter = idx;
    setStatus(idx);

    // Reset flag can be used later if you want UI to clear on reset.
    // if (rflag) { ... }

    if (logText) appendLog(logText);

  } catch(e) {
    // swallow; keep console usable even if network blips
  }
}

function startAuto(){
  stopAuto();
  // 500ms feels similar to Tasmota; tune as needed
  pollTimer = setInterval(() => {
    if (!chkAuto.checked) return;
    pollOnce();
  }, 500);
}

function stopAuto(){
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = 0;
}

async function sendCommand(){
  const cmd = (elCmd.value || "").trim();
  if (!cmd) return;

  // Matches your server-side block (currently commented out):
  // if (request->arg("c1")) ExecuteWebCommand(...)
  try {
    const url = buildUrl({ c1: cmd, c2: String(counter) });
    await fetch(url, { method:"GET", cache:"no-store" });
  } catch(e) {}

  elCmd.value = "";
  // Pull immediately after sending
  pollOnce();
}

document.getElementById("btnRefresh").onclick = () => pollOnce();
document.getElementById("btnClear").onclick   = () => clearLog();
document.getElementById("btnSend").onclick    = () => sendCommand();

elCmd.addEventListener("keydown", (ev) => {
  if (ev.key === "Enter") {
    ev.preventDefault();
    sendCommand();
  }
});

chkAuto.addEventListener("change", () => {
  if (chkAuto.checked) pollOnce();
});

elHint.textContent = `endpoint: ${CONSOLE_URL}`;

pollOnce();
startAuto();
</script>

</body>
</html>
