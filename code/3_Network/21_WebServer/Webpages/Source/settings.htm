<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no" name="viewport">
	<title>PulSar Settings</title>
	<style>html{visibility:hidden}</style>
	<script>
		(function loadFiles(){
			const l=document.createElement('script');
			l.src='/common.js';
			l.onload=()=>loadResources(['/style.css'],S);
			l.onerror=()=>setTimeout(loadFiles,100);
			document.head.appendChild(l);
		})();
		function S(){getLoc();}
	</script>
	<style>
		body{height:100px;margin:0 auto;max-width:520px}
		html{--h:9vh}
		button{display:block;border-radius:var(--h);font-size:clamp(1rem,6vw,2rem);height:var(--h);width:calc(100% - 40px);margin:2vh auto 0;padding:0}
	</style>
</head>
<body>
<h2>PulSar Settings</h2>
<button type="submit" onclick="window.location=getURL('/settings/network')">Network</button>
<button type="submit" onclick="window.location=getURL('/settings/hardware')">Hardware</button>
<button type="submit" onclick="window.location=getURL('/settings/system')">System</button>
<button type="submit" onclick="window.location=getURL('/settings/modules')">Modules</button>
<button type="submit" onclick="window.location=getURL('/settings/storage')">Storage</button>
<button type="submit" onclick="window.location=getURL('/settings/logging')">Logging</button>
<button type="submit" onclick="window.location=getURL('/settings/security')">Security</button>
<button type="submit" onclick="window.location=getURL('/update')">Firmware Update</button>
<button type="submit" onclick="window.location=getURL('/')">Back</button>
</body>
</html>
