board                     = esp32dev
board_build.ldscript      =
board_build.partitions    = esp32_partition_app1984k_spiffs64k.csv
board_build.flash_mode    = dout
board_build.f_flash       = 40000000L
board_build.f_cpu         = 80000000L
build_unflags             = -Wall
                            -Wdeprecated-declarations
                            -Wpointer-arith
build_flags = -Wno-deprecated-declarations
              -w
              -Wno-overloaded-virtual
              -Wno-ambiguous-overload
              -Wall
              -D USE_MODULE_CORE__CRASH_RECORDER
              -Wl,-Map,firmware.map
              -Wl,--wrap=panicHandler
              -Wl,--wrap=xt_unhandled_exception
              -D PIOENV=\"$PIOENV\"
monitor_speed             = ${base.monitor_speed}
upload_speed              = 921600
upload_resetmethod        = nodemcu
upload_port               = COM3
extra_scripts             = ${base.extra_scripts}
shared_libdeps_dir        = ${base.shared_libdeps_dir}
lib_deps                  = ${base.lib_deps}
lib_ldf_mode              = chain
lib_extra_dirs = lib/lib_basic
                 lib/lib_network
                 lib/lib_display
                 lib/lib_onewire2023
                 lib/lib_sensor
                 lib/lib_custom
                 lib/lib_wled32
                 lib/lib_i2c
                 lib/lib_energy
