; ============================================================================
; PulSar PlatformIO Base Configuration
; ============================================================================
;
; New configuration path.
;
; Purpose:
;   base            = settings common to all PulSar hardware
;   base_esp8266    = ESP8266 hardware/build settings
;   base_esp32      = classic ESP32 hardware/build settings
;
; Device environments should inherit directly from the appropriate base.
;
; Temporary development/testing changes belong in the DEVICE environment.
; Once validated and applicable generally, promote them back into the base.
;
; Old common/core/whitehall/meadows/etc paths remain untouched while devices
; are progressively migrated.
;
; ============================================================================



; ============================================================================
; UNIVERSAL PULSAR BASE
; ============================================================================

[base]

framework                 = arduino

monitor_speed             = 115200

shared_libdeps_dir        = lib

lib_deps                  =

extra_scripts             = pio/strip-floats.py
                            pio/name-firmware.py
                            pio/gzip-firmware.py
                            gzip_fw.py
                            pio/override_copy.py
                            pre:pio/build_webpages.py
                            post:tools/post_copy_artifacts.py



; ============================================================================
; ESP8266 BASE
; ============================================================================
;
; Modern ESP8266 path validated September 2026.
;
; PlatformIO espressif8266 4.2.1
; Arduino ESP8266 core 3.1.2
;
; ============================================================================

[base_esp8266]

framework                 = ${base.framework}

platform                  = espressif8266@4.2.1

platform_packages         = platformio/toolchain-xtensa @ ~2.100300.220621

board                     = esp01_1m

board_build.filesystem    = littlefs
custom_unpack_dir         = unpacked_littlefs

board_build.flash_mode    = dout
board_build.ldscript      = eagle.flash.1m.ld
board_build.f_flash       = 40000000L
board_build.f_cpu         = 80000000L

build_unflags             = -Wall
                            -Wdeprecated-declarations

build_flags               = -Wno-deprecated-declarations
                            -Wl,-Map,firmware.map
                            -D CORE_DEBUG_LEVEL=0
                            -D NDEBUG
                            -w
                            -mtarget-align
                            -DFP_IN_IROM
                            -DBEARSSL_SSL_BASIC
                            -DVTABLES_IN_FLASH
                            -DMIMETYPE_MINIMAL

monitor_speed             = ${base.monitor_speed}

upload_speed              = 921600
upload_resetmethod        = nodemcu
upload_port               = COM3

extra_scripts             = ${base.extra_scripts}

shared_libdeps_dir        = ${base.shared_libdeps_dir}
lib_deps                  = ${base.lib_deps}

lib_ldf_mode              = chain+

lib_extra_dirs            = lib/libesp8266/network
                            lib/lib_network
                            lib/lib_basic
                            lib/lib_sensor
                            lib/lib_custom
                            lib/lib_tasserial2
                            lib/lib_network_web
                            lib/lib_esp8266_jan26



; ============================================================================
; ESP32 BASE
; ============================================================================
;
; Initial replacement for the current common32 path.
;
; Keep this aligned with known-working ESP32 builds while devices are moved
; away from platformio_32.ini.
;
; ============================================================================

[base_esp32]

framework                 = ${base.framework}

platform                  = espressif32@5.3.0

platform_packages         = platformio/framework-arduinoespressif32 @ 3.20005.220925

board                     = esp32dev

board_build.ldscript      =
board_build.partitions    = esp32_partition_app1984k_spiffs64k.csv
board_build.flash_mode    = dout
board_build.f_flash       = 40000000L
board_build.f_cpu         = 80000000L

build_unflags             = -Wall
                            -Wdeprecated-declarations
                            -Wpointer-arith

build_flags               = -Wno-deprecated-declarations
                            -w
                            -Wno-overloaded-virtual
                            -Wno-ambiguous-overload
                            -Wall
                            -Wl,-Map,firmware.map
                            -Wl,--wrap=panicHandler
                            -Wl,--wrap=xt_unhandled_exception
                            -D PIOENV=\"$PIOENV\"

monitor_speed             = ${base.monitor_speed}

upload_speed              = 921600
upload_resetmethod        = nodemcu
upload_port               = COM3

extra_scripts             = ${base.extra_scripts}

shared_libdeps_dir        = ${base.shared_libdeps_dir}
lib_deps                  = ${base.lib_deps}

lib_ldf_mode              = chain

lib_extra_dirs            = lib/lib_basic
                            lib/lib_network
                            lib/lib_display
                            lib/lib_onewire2023
                            lib/lib_sensor
                            lib/lib_custom
                            lib/lib_wled32
                            lib/lib_i2c
                            lib/lib_energy
                            lib/lib_network_web
                            lib/libesp32
                            lib/lib_default
                            lib/libesp32/network
                            lib/lib_nextion_esp32_web
                            lib/lib_tasserial2
                            lib/lib_npb_feb26
                            lib/lib_npb_himethod
                            lib/lib_filters
                            lib/lib_rf_extended
                            lib/lib_ir