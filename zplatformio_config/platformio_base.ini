                 lib/lib_nextion_esp32_web
                 lib/lib_tasserial2
                 lib/lib_npb_feb26
                 lib/lib_npb_himethod
                 lib/lib_filters
                 lib/lib_rf_extended
                 lib/lib_ir
                 lib/lib_fastled



; ============================================================================
; ESP32-S3 BASE
; ============================================================================
;
; Generic ESP32-S3 base.
; Flash/partition-specific settings belong in derived hardware bases.
;
; ============================================================================

[base_esp32s3]
framework = ${base.framework}
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.partitions = partitions/esp32s3_test.csv
board_build.ldscript =
board_build.flash_mode = dio
board_build.boot = qio
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
build_unflags = ${base_esp32.build_unflags}
                -mtarget-align
build_flags = ${base_esp32.build_flags}
              -D ARDUINO_USB_CDC_ON_BOOT=1
              -D ARDUINO_USB_MODE=1
lib_ldf_mode = ${base_esp32.lib_ldf_mode}
monitor_speed = ${base.monitor_speed}
upload_speed = 921600
upload_resetmethod = nodemcu
upload_port = COM3
extra_scripts = ${base.extra_scripts}
shared_libdeps_dir = ${base.shared_libdeps_dir}
lib_deps = ${base.lib_deps}
lib_extra_dirs = ${base_esp32.lib_extra_dirs}



; ============================================================================
; ESP32-C3 BASE
; ============================================================================

[base_esp32c3]
framework = ${base.framework}
platform = espressif32@5.3.0
platform_packages = platformio/framework-arduinoespressif32@3.20005.220925
board = esp32-c3-devkitm-1
board_build.mcu = esp32c3
board_build.partitions = partitions/esp32c3_test.csv
board_build.ldscript =
build_unflags = -mtarget-align
build_flags = -w
              -Wl,-Map,firmware.map
              -Wl,--wrap=panicHandler
              -D SETTINGS_LOCATION=0x300000
              -D SETTINGS_SIZE=0x10000
              -D ARDUINO_USB_CDC_ON_BOOT=0
              -D ARDUINO_USB_MODE=1
monitor_speed = ${base.monitor_speed}
upload_speed = 921600
upload_resetmethod = nodemcu
upload_port = COM3
extra_scripts = ${base.extra_scripts}
shared_libdeps_dir = ${base.shared_libdeps_dir}
lib_deps = ${base.lib_deps}
lib_ldf_mode = chain
lib_extra_dirs = ${base_esp32.lib_extra_dirs}



; ============================================================================
; ESP32-S3 N16R8 BASE
; ============================================================================
;
; ESP32-S3
; 16 MB QIO flash
; 8 MB OPI PSRAM
;
; Flash layout:
;
; app0     0x00010000 - 0x007FFFFF   0x7F0000 = 8,323,072 bytes
; app1     0x00800000 - 0x00FEFFFF   0x7F0000 = 8,323,072 bytes
; settings 0x00FF0000 - 0x00FFFFFF   0x010000 =    65,536 bytes
;
; ============================================================================

[base_esp32s3_n16r8]
extends = base_esp32s3
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.partitions = partitions/esp32s3_16mb_50_50_ota.csv
board_build.flash_mode = qio
board_build.boot = qio
board_build.arduino.memory_type = qio_opi
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_upload.maximum_size = 8323072
build_flags = ${base_esp32s3.build_flags}
              -D BOARD_HAS_PSRAM
lib_ldf_mode = ${base_esp32s3.lib_ldf_mode}
monitor_speed = ${base_esp32s3.monitor_speed}
upload_speed = ${base_esp32s3.upload_speed}
upload_resetmethod = ${base_esp32s3.upload_resetmethod}
upload_port = COM3
extra_scripts = ${base_esp32s3.extra_scripts}
shared_libdeps_dir = ${base_esp32s3.shared_libdeps_dir}
lib_deps = ${base_esp32s3.lib_deps}
lib_extra_dirs = ${base_esp32s3.lib_extra_dirs}