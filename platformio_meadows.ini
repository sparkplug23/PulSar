[env:cm_office__monitor_backlight]
extends = env:whitehall_32
platform = espressif32@5.3.0
platform_packages =   platformio/framework-arduinoespressif32 @ 3.20005.220925
board_build.ldscript =
build_flags = ${common.build_flags} -w
                    -D DEVICE_MEADOWS__OFFICE__MONITORS_BACKLIGHT 
                    -D FIRMWARE_DEFAULT__LIGHTING_CONFIG__COMPLETE
                    -D USE_USER_MICHAEL           
                    '-DDEVICENAME_CTR="office_monitor_backlight"'
                    '-DDEVICENAME_FRIENDLY_CTR="office_monitor_backlight#Office"'
                    '-DD_MQTTSERVER_IP_ADDRESS_COMMA_DELIMITED="192.168.3.70"'
                    ; Add crash recording
                    -Wl,-Map,firmware.map
                    -Wl,--wrap=panicHandler -Wl,--wrap=xt_unhandled_exception
lib_extra_dirs = ${common32.lib_extra_dirs}
upload_protocol = espota
; upload_port = 192.168.2.129
upload_port = office-monitor-backlight
; monitor_filters = esp32_exception_decoder
; build_type = debug
; upload_port = COM7



