; ============================================================================
; PulSar - Board Validation
; ============================================================================
;
; Validation of exact, known physical hardware.
;
; Purpose:
;   - "I have this hardware exactly; can I compile and run PulSar on it?"
;   - Use the real chipset, flash layout, filesystem, PSRAM and GPIO/template
;     configuration appropriate to that board.
;   - Firmware should compile, fit and be flashable onto the named hardware.
;
; Also includes board emulations:
;   - Known commercial-device configurations reproduced on easier development
;     hardware for serial debugging, development and recovery.
;
; ============================================================================


; ============================================================================
; ESP8266 / ESP8285 - Development Boards
; ============================================================================

[env:valid__board__esp8266__nodemcu]
extends = base_esp8266
board = valid__esp8266__minimal__nodemcu_withfs4m
board_build.ldscript = ldscripts/pulsar.esp8266.flash.4m2m.littlefs.ld
board_build.filesystem = littlefs
build_flags = ${base_esp8266.build_flags}
              -D USER_MICHAEL
              -D DEVICE_VALIDATION__ESP8266__MINIMAL__NODEMCU


; ============================================================================
; ESP8266 / ESP8285 - Commercial Boards
; ============================================================================
;
; Add/migrate actual hardware configurations here:
;
;   valid__board__esp8266__sonoff_basic
;   valid__board__esp8266__shelly_dimmer
;   valid__board__esp8285__sonoff_ifan03
;
; ============================================================================


; ============================================================================
; ESP8266 / ESP8285 - Development Board Emulations
; ============================================================================

[env:valid__board__esp8266__sonoff_basic_clone_nodemcu]
extends = base_esp8266
board_build.ldscript = ldscripts/pulsar.esp8266.flash.1m0.nofs.ld
build_flags = ${base_esp8266.build_flags}
              -D ESP8266_FLASH_LAYOUT_1M0_NOFS
              -D PULSAR_HAS_FILESYSTEM=0
              -D PULSAR_LEGACY_COMPILED_DEFAULTS_ONLY=1
              -D DISABLE_MODULE_CORE_FILESYSTEM
              -D DEVICE_TESTBED__SONOFF_BASIC_CLONE_NODEMCU
              '-DDEVICENAME_CTR="testbed_09__sonoff_nodemcu"'
              '-DDEVICENAME_FRIENDLY_CTR="Socket Basic 01#Roaming"'
              '-DDEVICENAME_ROOMHINT_CTR="Roaming"'
              '-DD_MQTTSERVER_IP_ADDRESS_COMMA_DELIMITED="192.168.3.70"'
upload_port = COM21

[env:valid__board__esp8266__shelly_dimmer_clone_nodemcu]
extends = base_esp8266
board_build.ldscript = ldscripts/pulsar.esp8266.flash.1m0.nofs.ld
build_flags = ${base_esp8266.build_flags}
              -D ESP8266_FLASH_LAYOUT_1M0_NOFS
              -D PULSAR_HAS_FILESYSTEM=0
              -D PULSAR_LEGACY_COMPILED_DEFAULTS_ONLY=1
              -D DISABLE_MODULE_CORE_FILESYSTEM
              -D DEVICE_TESTBED__SHELLY_DIMMER_CLONE_NODEMCU
              '-DDEVICENAME_CTR="testbed_09__shelly_dimmer_nodemcu"'
              '-DDEVICENAME_FRIENDLY_CTR="Shelly Dimmer Testbed#Roaming"'
              '-DDEVICENAME_ROOMHINT_CTR="Roaming"'
              '-DD_MQTTSERVER_IP_ADDRESS_COMMA_DELIMITED="192.168.3.70"'
upload_port = COM21
; upload_port = 192.168.2.141
; upload_port = testbed-09--sonoff-nodemcu.local
; upload_protocol = espota
; extra_scripts = gzip_fw.py


; ============================================================================
; ESP32 - Development Boards
; ============================================================================

[env:valid__board__esp32__devkit_doit]
extends = base_esp32
build_flags = ${base_esp32.build_flags}
              -D USER_MICHAEL
              -D DEVICE_VALIDATION__ESP32__MINIMAL_DEVKIT
              -D FIRMWARE_DEFAULT__WEBSERVER__ADVANCED
              '-DDEVICENAME_CTR="validation"'
              '-DDEVICENAME_FRIENDLY_CTR="Validation#Desk"'


; ============================================================================
; ESP32 - WROVER-E Camera
; ============================================================================

[env:valid__board__esp32__camera_wrover]
extends = base_esp32
board = esp32dev
board_build.flash_mode = dio
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.psram = enabled
board_build.partitions = partitions/esp32_default.csv
lib_ignore = esp32-camera
lib_ldf_mode = deep+
build_flags = ${base_esp32.build_flags}
              -D USER_MICHAEL
              -D DEVICE_VALIDATION__ESP32__CAMERA_WROOVER_E
              -D USE_MODULE_DRIVERS__CAMERA
              -D FIRMWARE_DEFAULT__WEBSERVER__NORMAL
              -D ENABLE_DEVFEATURE_ANALOG_WRITE_EMULATION_VERSION2
              -D I2C_BUS_SPEED=400000
              -D BOARD_HAS_PSRAM
              '-DDEVICENAME_CTR="validation_cam_wroover"'
              '-DDEVICENAME_FRIENDLY_CTR="Validation Camera WROVER-E#Desk"'
              '-DDEVICENAME_DESCRIPTION_CTR="ESP32;WROVER-E;Validation"'
              '-DMQTT_HOST="192.168.3.70"'
              -D SETTINGS_LOCATION=0x300000
              -D SETTINGS_SIZE=0x10000
              -D ARDUINO_USB_CDC_ON_BOOT=1
              -D ARDUINO_USB_MODE=1
              -D Serial=Serial0
              -D ENABLE_DEBUG_MANUAL_DELAYS
              -D DISABLE_LEDC_DEFINE_TO_PATCH_BUILD_ERROR_JUNE25
              -D ENABLE_IMMEDIATE_BOOT_SERIAL_PRINT_WHILE
              -Ilib/lib_esp32_camera2/driver/private_include
              -Ilib/lib_esp32_camera2/driver/include
              -Ilib/lib_esp32_camera2/conversions
              -I"C:/Users/micha/.platformio/packages/framework-arduinoespressif32/tools/esp32-arduino-libs/esp32/include/esp_hw_support/include"
              -I "$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/FS/src"
              -I "$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/SD_MMC/src"
upload_protocol = esptool

; ============================================================================
; ESP32 - ESP-EYE Camera
; ============================================================================

[env:valid__board__esp32__camera_eye]
extends = base_esp32
board = esp32dev
board_build.flash_mode = dio
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.psram = enabled
board_build.partitions = partitions/esp32_default.csv
lib_ignore = esp32-camera
lib_ldf_mode = chain+
build_flags = ${base_esp32.build_flags}
              -D USER_MICHAEL
              -D DEVICE_TESTGROUP__BOARDBUILDS__ESP32_CAM_EYE
              -D ENABLE_DEVFEATURE_ANALOG_WRITE_EMULATION_VERSION2
              -D I2C_BUS_SPEED=400000
              -D BOARD_HAS_PSRAM
              -D ENABLE_DEBUGFEATURE_TELEMETRY__MQTT_SEND_HEALTH_EVERY_SECOND
              -D SETTINGS_LOCATION=0x300000
              -D SETTINGS_SIZE=0x10000
              -D CORE_DEBUG_LEVEL=5
              -D Serial=Serial0
              -D ENABLE_DEBUG_LINE_HERE3
              -D ENABLE_DEBUG_MANUAL_DELAYS
              -D ENABLE_DEBUGFEATURE_LOGS__FORCE_FLUSH_ON_TRANSMIT
              -D DISABLE_LEDC_DEFINE_TO_PATCH_BUILD_ERROR_JUNE25
              -D ENABLE_IMMEDIATE_BOOT_SERIAL_PRINT_WHILE
              -D ENABLE_DEBUG_MODULE_HARDWAREPINS_SUBSECTION_TEMPLATES
              -Ilib/lib_esp32_camera2/driver/private_include
              -Ilib/lib_esp32_camera2/driver/include
              -Ilib/lib_esp32_camera2/conversions
              -I"C:/Users/micha/.platformio/packages/framework-arduinoespressif32/tools/esp32-arduino-libs/esp32/include/esp_hw_support/include"
upload_protocol = esptool
upload_port = COM95
upload_speed = 460800


