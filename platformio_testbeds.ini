[env:testbed_01__sensors_nextion]
extends = env:testbed_32
build_flags = ${common.build_flags} -w
                    -D DEVICE_TESTBED_01__SENSORS_NEXTION
                    -D FIRMWARE_DEFAULT__LIGHTING_CONFIG__COMPLETE
                    ; -D ENABLE_FEATURE_LIGHTING__DISABLE_WEBPAGE_TO_REDUCE_MEMORY_USAGE
                    ; -D ENABLE_DEBUGFEATURE_TASKER__DEBUG_MEMORY_PER_MODULE
                    ; -D ENABLE_FEATURE_DEBUG_TASKER_INTERFACE_PERFORMANCE
                    -D USE_USER_MICHAEL            
                    '-DDEVICENAME_CTR="testbed_01__sensors_nextion"'
                    '-DDEVICENAME_FRIENDLY_CTR="testbed_01__sensors_nextion#Office"'
                    '-DD_MQTTSERVER_IP_ADDRESS_COMMA_DELIMITED="192.168.3.70"'
                    ; -Wl,-Map,firmware.map
                    ; -Wl,--wrap=panicHandler -Wl,--wrap=xt_unhandled_exception
;                     -Wl,-Map,firmware_inspect.map
;                     ; ,_printf_float
;                     ; 1) lie about max app size so build won't be blocked
; board_upload.maximum_size = 3145728  ; 3MB (pick anything > your current .bin)
; ; 2) use a partitions CSV with a bigger app slot
; board_build.partitions = partitions_inspect.csv
; ; 3) (optional) lie about flash size (only for this env)
; board_upload.flash_size = 4MB
; board_build.flash_size  = 4MB
lib_extra_dirs = ${common32.lib_extra_dirs}
upload_protocol = espota
upload_port = 192.168.2.140
; upload_port = testbed-01--sensors-nextion.local
; monitor_filters = esp32_exception_decoder
; build_type = debug
; upload_port = COM37



[env:testbed_02__motion_audio]
