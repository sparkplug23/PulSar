[env:testbed_05__switch_button]
extends = env:whitehall_32
platform = espressif32@5.3.0
platform_packages =   platformio/framework-arduinoespressif32 @ 3.20005.220925
board_build.ldscript =
build_unflags = -Wall -Wextra -Werror
build_flags       = ${common.build_flags} 
                -D DEVICE_TESTBED_05__SWITCHES_BUTTONS
                -D FIRMWARE_DEFAULT__INCLUDE_WEBSERVER_FULL
                -w
                -Wno-packed-bitfield-compat
                -D USE_USER_MICHAEL    
                '-DDEVICENAME_CTR="testbed_05__switch_button"'
                '-DDEVICENAME_FRIENDLY_CTR="testbed_05__switch_button#Testbed"'
                '-DMQTT_HOST="192.168.3.70"'
; upload_port = COM53
upload_protocol = espota
; upload_port = 192.168.0.28
upload_port = testbed-05--switch-button.local





