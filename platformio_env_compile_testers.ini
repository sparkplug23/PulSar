[env:compile_test_32]
extends                 = common32
framework               = ${common.framework}
platform                = ${common32.platform}
platform_packages       = ${common32.platform_packages}
board                   = ${common32.board}
board_build.ldscript    = ${common32.board_build.ldscript}
board_build.partitions  = ${common32.board_build.partitions}
board_build.flash_mode  = ${common32.board_build.flash_mode}
board_build.f_flash     = ${common32.board_build.f_flash}
board_build.f_cpu       = ${common32.board_build.f_cpu}
monitor_speed           = ${common32.monitor_speed}
upload_port             = ${common32.upload_port}
upload_resetmethod      = ${common32.upload_resetmethod}
upload_speed            = ${common32.upload_speed}
extra_scripts           = ${common32.extra_scripts}
build_unflags           = ${common32.build_unflags}
build_flags             = ${common32.build_flags}
                            -D USE_USER_MICHAEL
                            '-DSTA_SSID1="Aurora2400"'
                            '-DSTA_PASS1="af4d8bc9ab"'
lib_extra_dirs          = ${common32.lib_extra_dirs}
lib_ldf_mode = chain
lib_deps = ${common.lib_deps}
lib_ignore              =
    cc1101
    ESP32 Azure IoT Arduino
    ESP32 Async UDP
    ESP32 BLE Arduino
    SimpleBLE
    NetBIOS
    Preferences
    BluetoothSerial


[env:valid__esp32__minimal__devkit]
extends = env:compile_test_32
build_flags = ${common.build_flags} -w
                    -D DEVICE_VALIDATION__ESP32__MINIMAL_DEVKIT
                    -D ENABLE_FEATURE_BUILD__10JAN25_SOFTAP_WEBUI
                    -D USE_USER_MICHAEL
                    '-DDEVICENAME_CTR="validation"'
                    '-DDEVICENAME_FRIENDLY_CTR="Validation#Desk"'
; upload_protocol = espota
; upload_port = 192.168.2.36
; upload_port = 192.168.2.67
; upload_port = cm-office--pebble-playlists
; monitor_filters = esp32_exception_decoder
; build_type = debug
upload_port = COM98
; upload_port = COM83


[env:valid__esp32__lgt_basic]
extends = env:compile_test_32
build_flags = ${common.build_flags} -w
                    -D DEVICE_VALIDATION__ESP32__LIGHTING__1D_SINGLE_BUS
                    -D FIRMWARE_DEFAULT__LIGHTING_CONFIG__COMPLETE
                    -D FIRMWARE_DEFAULT__LIGHTING_CONFIG__BETA
                    -D ENABLE_FEATURE_BUILD__10JAN25_SOFTAP_WEBUI
                    -D STRIP_DEFAULT_LENGTH=100
                    -D ENABLE_DEBUGFEATURE_LIGHTS__SEGMENT_BRIGHTNESS_LIMIT_VALUE=20
                    ; -D ENABLE_DEBUGFEATURE_LIGHTS__GLOBAL_BRIGHTNESS_LIMIT_VALUE=10
                    -D USE_USER_MICHAEL
                    '-DDEVICENAME_CTR="validation"'
                    '-DDEVICENAME_FRIENDLY_CTR="Validation#Desk"'
; upload_protocol = espota
; upload_port = 192.168.2.36
; upload_port = 192.168.2.67
; upload_port = cm-office--pebble-playlists
; monitor_filters = esp32_exception_decoder
; build_type = debug
upload_port = COM98
; upload_port = COM83




