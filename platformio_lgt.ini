[env:tg_lgt__esp32_matrix_16x16] # pixels are horizontal, but "sideways" so taller and wider. so maybe Tall8Wx32H, Wide32Wx8H
extends = env:whitehall_32
; platform = espressif32@5.3.0
; platform_packages =   platformio/framework-arduinoespressif32 @ 3.20005.220925
; board_build.ldscript =
build_flags = ${common.build_flags} -w
                    -D DEVICE_TESTGROUP__LIGHTING_EFFECTS__ESP32_1CH_MATRIX_16W16H 
                    -D FIRMWARE_DEFAULT__MODULE_TEMPLATE__GENERIC_MINIMUM
                    -D FIRMWARE_DEFAULT__LIGHTING_CONFIG__2D
                    -D FIRMWARE_DEFAULT__LIGHTING_CONFIG__COMPLETE
                    ; -D ENABLE_FEATURE_LIGHTING__DISABLE_WEBPAGE_TO_REDUCE_MEMORY_USAGE
                    -D ENABLE_DEBUGFEATURE_LIGHTS__SEGMENT_BRIGHTNESS_LIMIT_VALUE=100
                    -D USE_USER_MICHAEL            
                    '-DDEVICENAME_CTR="tg_lgt__matrix_16w16h"'
                    '-DDEVICENAME_FRIENDLY_CTR="LGT Matrix 16x16 2D Effects#Office"'
                    '-DDEVICENAME_DESCRIPTION_CTR="LGT Matrix 16x16 2D Effects;Office"'
                    '-DD_MQTTSERVER_IP_ADDRESS_COMMA_DELIMITED="192.168.3.70"'
                    -DCORE_DEBUG_LEVEL=5
                    -DCONFIG_ARDUHAL_LOG_DEFAULT_LEVEL=5
                    -DARDUHAL_LOG_COLORS=0
                    ; Add crash recording
                    -D USE_MODULE_CORE__CRASH_RECORDER
                    -Wl,-Map,firmware.map
                    -Wl,--wrap=panicHandler -Wl,--wrap=xt_unhandled_exception
lib_extra_dirs = ${common32.lib_extra_dirs}
                            lib/lib_tasserial2 #  # NEEDS platform 5.3.0+ 
                            lib/lib_npb_himethod
upload_protocol = espota
; upload_port = 192.168.2.32
upload_port = tg-lgt--matrix-16w16h.local
; monitor_filters = esp32_exception_decoder
; build_type = debug
; upload_port = COM68


