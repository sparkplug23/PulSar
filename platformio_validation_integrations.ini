; ============================================================================
; PulSar - Integration Validation
; ============================================================================
;
; Broad PulSar integration builds.
;
; Purpose:
;   - Compile major groups of functionality together.
;   - Detect cross-module, dependency, include and #ifdef problems.
;   - Exercise configurations significantly larger than chipset validation.
;
; These builds do not necessarily represent a particular physical device.
; *_all builds may deliberately exceed normal practical flash requirements.
;
; ============================================================================


; ============================================================================
; ESP32 - Home Lighting
; ============================================================================
;
; Representative minimum/default build for normal ambient home lighting.
; Deliberately not "lighting_all", since PulSar contains multiple specialised
; lighting build types which are not required by a normal home light.
;

[env:valid__integration__lighting_home]
extends = base_esp32
build_flags = ${base_esp32.build_flags}
              -D USER_MICHAEL
              -D DEVICE_VALIDATION__ESP32__LIGHTING__1D_SINGLE_BUS
              -D FIRMWARE_DEFAULT__LIGHTING_CONFIG__COMPLETE
              -D FIRMWARE_DEFAULT__WEBSERVER__ADVANCED
              -D FIRMWARE_DEFAULT__LIGHTING_WEBUI__ADVANCED
              -D ENABLE_FEATURE_LIGHTING__EFFECTS__GENERAL_DEFAULT
              -D STRIP_DEFAULT_LENGTH=100
              -D ENABLE_DEBUGFEATURE_LIGHTS__SEGMENT_BRIGHTNESS_LIMIT_VALUE=15
              '-DDEVICENAME_CTR="validation"'
              '-DDEVICENAME_FRIENDLY_CTR="Validation#Desk"'


; ============================================================================
; ESP32 - All Sensors
; ============================================================================

[env:valid__integration__sensors_all]
extends = base_esp32
build_flags = ${base_esp32.build_flags}
              -D USER_MICHAEL
              -D DEVICE_VALIDATION__ESP32__SENSORS_ALL
              -D FIRMWARE_DEFAULT__WEBSERVER__ADVANCED
              '-DDEVICENAME_CTR="validation"'
              '-DDEVICENAME_FRIENDLY_CTR="Validation#Desk"'


; ============================================================================
; ESP32 - All Drivers
; ============================================================================

[env:valid__integration__drivers_all]
extends = base_esp32
build_flags = ${base_esp32.build_flags}
              -D USER_MICHAEL
              -D DEVICE_VALIDATION__ESP32__DRIVERS_ALL
              -D FIRMWARE_DEFAULT__WEBSERVER__ADVANCED
              '-DDEVICENAME_CTR="validation"'
              '-DDEVICENAME_FRIENDLY_CTR="Validation#Desk"'
              -D ENABLE_DEBUGFEATURE_LOGS__FORCE_FLUSH_ON_TRANSMIT
              -D DISABLE_LEDC_DEFINE_TO_PATCH_BUILD_ERROR_JUNE25
              -D ENABLE_IMMEDIATE_BOOT_SERIAL_PRINT_WHILE
              -D ENABLE_DEVFEATURE_ANALOG_WRITE_EMULATION_VERSION2
              -D ENABLE_DEVFEATURE_ESP32__AUTO_MUTEX
              -D BOARD_HAS_PSRAM
              -D SETTINGS_LOCATION=0x300000
              -D SETTINGS_SIZE=0x10000
              -D Serial=Serial0
              -D ENABLE_DEBUG_MODULE_HARDWAREPINS_SUBSECTION_TEMPLATES
              -Ilib/lib_esp32_camera2/driver/private_include
              -Ilib/lib_esp32_camera2/driver/include
              -Ilib/lib_esp32_camera2/conversions
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = partitions_inspect.csv


; ============================================================================
; ESP32 - All Modules
; ============================================================================

[env:valid__integration__modules_all]
extends = base_esp32
build_flags = ${base_esp32.build_flags}
              -D USER_MICHAEL
              -D DEVICE_VALIDATION__ESP32__MODULES_ALL
              -D FIRMWARE_DEFAULT__WEBSERVER__ADVANCED
              '-DDEVICENAME_CTR="validation"'
              '-DDEVICENAME_FRIENDLY_CTR="Validation#Desk"'
              -D ENABLE_DEBUGFEATURE_LOGS__FORCE_FLUSH_ON_TRANSMIT
              -D DISABLE_LEDC_DEFINE_TO_PATCH_BUILD_ERROR_JUNE25
              -D ENABLE_IMMEDIATE_BOOT_SERIAL_PRINT_WHILE
              -D ENABLE_DEVFEATURE_ANALOG_WRITE_EMULATION_VERSION2
              -D ENABLE_DEVFEATURE_ESP32__AUTO_MUTEX
              -D BOARD_HAS_PSRAM
              -D SETTINGS_LOCATION=0x300000
              -D SETTINGS_SIZE=0x10000
              -D Serial=Serial0
              -D ENABLE_DEBUG_MODULE_HARDWAREPINS_SUBSECTION_TEMPLATES
              -Ilib/lib_esp32_camera2/driver/private_include
              -Ilib/lib_esp32_camera2/driver/include
              -Ilib/lib_esp32_camera2/conversions
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions_inspect.csv