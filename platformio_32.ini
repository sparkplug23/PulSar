[common32]
platform                = ${core32.platform}
platform_packages       = ${core32.platform_packages}
board                   = esp32dev
board_build.ldscript    = ${core32.board_build.ldscript}
board_build.partitions  = esp32_partition_app1984k_spiffs64k.csv
board_build.flash_mode  = ${common.board_build.flash_mode}
board_build.f_flash     = ${common.board_build.f_flash}
board_build.f_cpu       = ${common.board_build.f_cpu}
build_unflags           = ${esp_defaults.build_unflags}
                          -Wpointer-arith
monitor_speed           = ${common.monitor_speed}
upload_port             = ${common.upload_port}
upload_resetmethod      = ${common.upload_resetmethod}
upload_speed            = 921600
extra_scripts           = ${common.extra_scripts}
                                pre:pio/build_webpages.py   
lib_ldf_mode = chain                          
build_flags             = ${esp_defaults.build_flags}

                            -w
                            -Wno-overloaded-virtual
                            -Wno-ambiguous-overload
                            -Wall

    ; -D CORE_DEBUG_LEVEL=0
    ; -D BUFFER_LENGTH=128
    ; -D MQTT_MAX_PACKET_SIZE=1200
    ; -D uint32=uint32_t
    ; -D uint16=uint16_t
    ; -D uint8=uint8_t
    ; -D sint8_t=int8_t
    ; -D sint32_t=int32_t
    ; -D sint16_t=int16_t
    ; -D memcpy_P=memcpy
	;   -D memcmp_P=memcmp
shared_libdeps_dir      = lib
; *** Library disable / enable for variant Tasmota. Disable reduces compile time
; *** !!! Disabling needed libs will generate compile errors !!!
; *** The resulting firmware will NOT be different if you leave all libs enabled
; *** Disabling by putting a ";" in front of the lib name
; *** If you dont know what it is all about, do not change
lib_extra_dirs            = lib/lib_basic
                            lib/lib_network
                            lib/lib_display 
                            lib/lib_onewire2023 
                            lib/lib_sensor                          
                            lib/lib_custom
                            lib/lib_basic
                            lib/lib_wled32
                            lib/lib_custom
                            lib/lib_neo_original25
                            lib/lib_i2c
                            lib/lib_energy
                            ; lib/lib_nextion_esp32_web
                            lib/lib_network_web
; *** ESP32 lib. ALWAYS needed for ESP32 !!!
                            lib/libesp32
                            lib/lib_custom
                            lib/lib_default
; *** ESP32 lib. ALWAYS needed for ESP32 !!!
                            ;    
; *** Only disabled for Tasmota minimal and Tasmota light. For all other variants needed!
                            lib/lib_basic
; ; **** I2C devices. Most sensors. Disable only if you dont have ANY I2C device enabled
;                             lib/lib_i2c
                            lib/libesp32/network
                            lib/lib_network
; ; *** Displays. Disable if you dont have any Display activated
;                             lib/lib_display
; ; *** Bear SSL and base64. Disable if you dont have SSL or TLS activated
;                             lib/lib_ssl
; ; *** Audio needs a lot of time to compile. Mostly not used functions. Recommended to disable
;                             lib/lib_audio
; ; *** RF 433 stuff (not RF Bridge). Recommended to disable
;                             lib/lib_rf
; *** Mostly not used functions. Recommended to disable
                            ;; lib/lib_div    
                            lib/lib_onewire2023 
                            lib/lib_sensor
                            lib/lib_custom
                            lib/libesp32
                            lib/lib_basic
                            lib/lib_basic
                            lib/lib_network
                            lib/lib_display
                            lib/lib_onewire2023 
                            lib/lib_sensor                          
                            lib/lib_custom
                            lib/lib_wled32
                            lib/lib_custom
                            ; lib/lib_neopixel_june24_ws2805
                            lib/lib_i2c
                            lib/lib_energy
                            lib/lib_nextion_esp32_web
                            lib/lib_default
                            ; lib/lib_tasserial1 # using tasserial from 2024 
                            lib/lib_tasserial2 #  # NEEDS platform 5.3.0+ 


[esp32_defaults]
build_unflags               = ${esp_defaults.build_unflags}
                              -Wswitch-unreachable
                              -Wstringop-overflow
                              -Wincompatible-pointer-types
                              -Wnonnull-compare
                              -fexceptions
                              -fno-lto
                              -Wpointer-arith
build_flags                 = ${esp_defaults.build_flags}
