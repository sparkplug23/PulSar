[build_envs]
default_envs = 
; *** Uncomment by deleting ";" in the line(s) below to select version(s)
                ;hacs
                ;hacs_lighting_ws2812
                ;hacs_lighting_pwm
                ;hacs_energy
                ;hacs_display
                
; *** Selection for ESP32 is done in platformio_32.ini



[common]
framework                 = arduino
board                     = esp01_1m
board_build.filesystem      = littlefs
custom_unpack_dir           = unpacked_littlefs
board_build.flash_mode    = dout
board_build.ldscript      = eagle.flash.1m.ld
;_DEBUGOUT1   ; THIS IS CAUSING THE ERROR FOR ESP32S3

platform                  = ${core.platform}
platform_packages         = ${core.platform_packages}
build_unflags             = ${core.build_unflags}
build_flags               = ${core.build_flags}

board_build.f_cpu         = 80000000L
board_build.f_flash       = 40000000L
; monitor_speed             = 921600
monitor_speed             = 115200
upload_speed              = 921600
; *** Upload Serial reset method for Wemos and NodeMCU
upload_resetmethod        = nodemcu
upload_port               = COM3
extra_scripts             = ${scripts_defaults.extra_scripts}
lib_ldf_mode              = chain+  
shared_libdeps_dir        = lib
lib_deps =
lib_extra_dirs            = 
                            lib/libesp8266/network 
                            lib/lib_network 
                            lib/lib_basic      
                            lib/lib_sensor 
                            lib/lib_custom
                            lib/lib_tasserial2
                            ;; added 14Sep26
                            lib/lib_network_web
                            lib/lib_esp8266_jan26

[scripts_defaults]
extra_scripts             = pio/strip-floats.py
                            pio/name-firmware.py
                            pio/gzip-firmware.py
                            gzip_fw.py
                            pio/override_copy.py    
                            pre:pio/build_webpages.py

                            # below if is a "pre" script, but using "AddPreAction" internally so no "pre:" prefix is needed on next line
                            ; pio-tools/pre/check_upload_port.py
                            ; pio-tools/download_fs.py     
                            post:tools/post_copy_artifacts.py

[esp_defaults]
; *** remove undesired all warnings
build_unflags             = -Wall
                            -Wdeprecated-declarations
build_flags               = -Wno-deprecated-declarations

; *********************************************************************
; *** Use custom settings from file user_config_override.h
                            ;-DUSE_CONFIG_OVERRIDE
; *********************************************************************


[esp82xx_defaults]
build_flags               = ${esp_defaults.build_flags}
                            -Wl,-Map,firmware.map
                            -D CORE_DEBUG_LEVEL=0
                            -D NDEBUG
                            -w
                            -mtarget-align
                            -DFP_IN_IROM
                            -DBEARSSL_SSL_BASIC
                            ; NONOSDK22x_190703 = 2.2.2-dev(38a443e)
                            -DPIO_FRAMEWORK_ARDUINO_ESPRESSIF_SDK22x_190703
                            ; lwIP 2 - Higher Bandwidth no Features
                            -DPIO_FRAMEWORK_ARDUINO_LWIP2_HIGHER_BANDWIDTH_LOW_FLASH
                            ; VTABLES in Flash
                            -DVTABLES_IN_FLASH                         
                            ; remove the 4-bytes alignment for PSTR()
                            ; -DPSTR_ALIGN=1
                            ; restrict to minimal mime-types
                            -DMIMETYPE_MINIMAL
                           

