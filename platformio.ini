

[platformio]
description = My ESP8266 / ESP32 based devices with Web, MQTT and OTA firmware
src_dir = code
; build_dir = .pioenvs
; boards_dir                  = boards
build_cache_dir = .cache
extra_configs = zplatformio_config/platformio_base.ini
                ; Legacy versions below which should move into the above
                PHASEOUT_platformio_8266.ini
                PHASEOUT_platformio_32.ini
                ; Central compiles, should be moved into other well defined files
                zplatformio_override.ini
                ; Whitehall 2026
                platformio_whitehall.ini
                ; Meadows 2026
                platformio_meadows.ini
                ; Lighting Testbeds: Added here to declutter everything else
                platformio_lgt.ini
                ; Cellular Enabled
                platformio_cellular.ini
                ; Examples of Common Builds
                platformio_templates.ini
                ; Validation: Generic MCU/chipset builds
                platformio_validation_chipsets.ini
                ; Validation: Known physical boards/designs (eg sonoff, shelly)
                platformio_validation_boards.ini
                ; Validation: Module/feature integration builds (rapidly test multiple/all modules in one build)
                platformio_validation_integrations.ini
                ; Minimal intermediate OTA recovery builds
                platformio_recovery.ini
                ; Developing
                platformio_developing.ini
                ; Physical experimental/integration testbeds
                platformio_testbeds.ini
                ; TestGroups: Cameras - phase into validation boards/testbeds as appropriate
                platformio_tg_cameras.ini
                ; Remote builds (Not in homes)
                platformio_remote.ini
                ; Seasonal builds (Xmas, Halloween, etc)
                platformio_seasonal.ini
                ; Additional groups
                build_env_groups/*.ini
default_envs =  ${build_envs.default_envs}


; chipsets      = does PulSar work on this MCU architecture?
; boards        = does PulSar work on this known physical board?
; integrations  = do these software/modules/features work together?
; testbeds      = does this experimental physical system work?
; recovery      = can I recover/reflash something?


; base_esp32
;     normal 2-slot OTA
;     ~2 MB / ~2 MB

; base_esp32_large_app
;     single large app
;     no OTA/recovery
;     maximum flash for bench/special cases

; base_esp32_safeboot
;     small recovery partition
;     large main PulSar partition