;;;;;;;;;;;;;;;;;;; Room Climate
[env:cm_mbedroom__ambient_sens]
board = esp32-c3-devkitm-1
board_build.mcu = esp32c3
framework = arduino
platform = espressif32@5.3.0
platform_packages = platformio/framework-arduinoespressif32@3.20005.220925
; upload_port = COM96
; upload_protocol = esptool
upload_port = 192.168.2.92
upload_speed = 460800
build_unflags = -mtarget-align
board_build.partitions = partitions/esp32c3_test.csv
board_build.ldscript =

lib_ldf_mode = chain+
; shared_libdeps_dir = lib
lib_extra_dirs =
    lib/lib_basic
    lib/lib_network
    lib/lib_display 
    lib/lib_onewire2023 
    lib/lib_sensor                          
    lib/lib_custom
    lib/lib_wled32
    lib/lib_neo_original25
    lib/lib_i2c
    lib/lib_energy
    lib/lib_network_web
    lib/libesp32
    lib/lib_default
    lib/libesp32/network
    lib/lib_neopixel_june24_ws2805
    lib/lib_nextion_esp32_web
    lib/lib_tasserial2

build_flags =
    -w
    -D DEVICE_MEADOWS__MASTER_BEDROOM__AMBIENT_SENSOR 
    -D USE_USER_MICHAEL            
    -D I2C_BUS_SPEED=400000
    '-DDEVICENAME_CTR="mbedroom__room_sensor"'
    '-DDEVICENAME_FRIENDLY_CTR="mbedroom__room_sensor C3MINI#Testbed"'
    '-DDEVICENAME_DESCRIPTION_CTR="ESP32C3;Super Mini;Testbed"'
    '-DD_MQTTSERVER_IP_ADDRESS_COMMA_DELIMITED="192.168.3.70"'                 
    ; -D ENABLE_ADVANCED_DEBUGGING
    ; -D ENABLE_DEBUG_FUNCTION_NAMES
    ; -D ENABLE_IMMEDIATE_BOOT_SERIAL_PRINT_WHILE
    ; -D ENABLE_DEBUG_LINE_HERE3
    ; -D ENABLE_DEBUGFEATURE_TIME__SHOW_UPTIME_EVERY_SECOND
    -D SETTINGS_LOCATION=0x300000
    -D SETTINGS_SIZE=0x10000
    -D CORE_DEBUG_LEVEL=5
    -D ARDUINO_USB_CDC_ON_BOOT=0 ; 1 stops boot without USB connected
    -D ARDUINO_USB_MODE=1        ; is required to see serial output
    ; -D CONFIG_IDF_TARGET_ESP32C3
    ; -D ENABLE_DEBUG_LINE_HERE
    ; -D ENABLE_DEBUG_LINE_HERE2
    -D ENABLE_DEBUG_MODULE_HARDWAREPINS_SUBSECTION_TEMPLATES
    -D LD2410_DEFAULT_SERIAL_NUMBER=1
    ; -D ENABLE_FEATURE_WIFI__SET_TXPOWER

; monitor_filters = esp32_exception_decoder
; build_type = debug
extra_scripts = post:pio-tools/copy_elf.py

;;;;;;;;;;;;;;;;;;; BedLighting
